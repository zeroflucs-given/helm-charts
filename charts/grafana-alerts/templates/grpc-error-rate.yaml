{{/*
gRPC Error Rate Alerts
Discovers services with grpcErrorRate.enabled=true and creates a single GrafanaAlertRuleGroup
*/}}

{{- $grafanaNamespace := .Values.grafanaNamespace -}}
{{- $grafanaInstance := .Values.grafanaInstance -}}
{{- $defaults := .Values -}}

{{/* Discover all alert configs */}}
{{- $allConfigs := include "grafana-alerts.discoverConfigs" . | fromJsonArray | default list -}}

{{/* Filter to services with grpcErrorRate enabled */}}
{{- $services := list -}}
{{- range $allConfigs -}}
  {{- $alertConfig := index . "grpcErrorRate" | default dict -}}
  {{- $enabled := index $alertConfig "enabled" -}}
  {{- if eq $enabled true -}}
    {{- $services = append $services . -}}
  {{- end -}}
{{- end -}}

{{- if $services }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: grpc-error-rate
  namespace: {{ $grafanaNamespace }}
  labels:
    app.kubernetes.io/managed-by: grafana-alerts
spec:
  folderRef: alerts
  instanceSelector:
    matchLabels:
      dashboards: {{ $grafanaInstance | quote }}
  interval: 1m
  rules:
{{- range $services }}
    {{- $svcConfig := index . "grpcErrorRate" | default dict }}
    {{- $threshold := index $svcConfig "threshold" | default $defaults.grpcErrorRate.threshold }}
    {{- $duration := index $svcConfig "duration" | default $defaults.grpcErrorRate.duration }}
    {{- $severity := index $svcConfig "severity" | default $defaults.grpcErrorRate.severity }}
    {{- $lookback := index $svcConfig "lookbackSeconds" | default $defaults.grpcErrorRate.lookbackSeconds }}
    {{- $noDataState := index $svcConfig "noDataState" | default $defaults.grpcErrorRate.noDataState }}
    {{- $execErrState := index $svcConfig "execErrState" | default $defaults.grpcErrorRate.execErrState }}
    {{- $isPaused := index $svcConfig "isPaused" | default $defaults.grpcErrorRate.isPaused }}
    {{- $namespace := index . "namespace" }}
    {{- $name := index . "name" }}
    {{- $service := index . "service" }}
    {{- $uid := printf "%s-%s-grpc-err" $namespace $name | trunc 40 }}
    - uid: {{ $uid }}
      title: "Service Error Rate: {{ $service }}"
      condition: C
      data:
        - refId: A
          relativeTimeRange:
            from: {{ $lookback }}
            to: 0
          datasourceUid: victoria-metrics
          model:
            datasource:
              type: victoriametrics-metrics-datasource
              uid: victoria-metrics
            editorMode: code
            expr: |-
              sum(
                increase(
                  grpc_server_errors{
                    service.name="{{ $service }}"
                  }[{{ $lookback }}s]
                )
              )
            format: time_series
            instant: false
            intervalMs: 60000
            legendFormat: __auto
            maxDataPoints: 43200
            range: true
            refId: A
        - refId: reducer
          queryType: expression
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: [0, 0]
                  type: gt
                operator:
                  type: and
                query:
                  params: []
                reducer:
                  params: []
                  type: avg
                type: query
            datasource:
              name: Expression
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            reducer: last
            refId: reducer
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            conditions:
              - evaluator:
                  params: [{{ $threshold }}]
                  type: gt
                operator:
                  type: and
                query:
                  params: [C]
                reducer:
                  params: []
                  type: last
                type: query
            datasource:
              type: __expr__
              uid: __expr__
            expression: reducer
            intervalMs: 1000
            maxDataPoints: 43200
            refId: C
            type: threshold
      noDataState: {{ $noDataState }}
      execErrState: {{ $execErrState }}
      for: {{ $duration }}
      annotations:
        description: "Service {{ $service }} is experiencing elevated gRPC error rates (>{{ $threshold }} errors). Investigate service health and logs."
        summary: "High gRPC error rate for {{ $service }}"
      labels:
        severity: {{ $severity }}
      isPaused: {{ $isPaused }}
{{- end }}
{{- end }}
